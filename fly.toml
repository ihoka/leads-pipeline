app = "leads-pipeline"
primary_region = "lhr"

[build]

[env]
  RAILS_ENV = "production"
  SOLID_QUEUE_IN_PUMA = "false"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[processes]
  web = "./bin/thrust ./bin/rails server"
  worker = "bundle exec rake solid_queue:start"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
